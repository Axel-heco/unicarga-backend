spring:
  application:
    name: Proyecto
  datasource:
    url: jdbc:mysql://localhost:3306/un1carga?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
    username: root
    password: ""
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.MySQLDialect

server:
  port: 8080
  
  management:
    endpoints:
      web:
        exposure:
          include: health, info