<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Inicio Sesión | Panasonic UN1Carga+</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet" />
  <link th:href="@{/css/styles.css}" href="../static/css/styles.css" rel="stylesheet" />
</head>
<body>
  <header class="d-flex justify-content-between align-items-center px-4 py-3">
    <span class="panasonic-wordmark">Panasonic</span>
    <span class="fw-bold fs-4 text-dark">UN1Carga+</span>
  </header>

  <main class="container d-flex flex-column justify-content-center align-items-center flex-grow-1 py-4">
    <h1 class="fw-bold display-5 mb-5 text-center">Inicio Sesión</h1>
    <div th:if="${error}" class="alert alert-danger w-100 text-center" style="max-width: 400px;" th:text="${error}">Credenciales inválidas</div>

    <form class="w-100" style="max-width: 400px;" th:action="@{/login}" method="post">
      <div class="mb-4 text-center">
        <label for="clave" class="form-label fw-bold text-uppercase small">Clave</label>
        <input type="text" id="clave" name="clave" class="form-control input-slate text-center" required />
      </div>
      <div class="mb-5 text-center">
        <label for="contrasena" class="form-label fw-bold text-uppercase small">Contraseña</label>
        <input type="password" id="contrasena" name="contrasena" class="form-control input-slate text-center" required />
      </div>
      <div class="text-center">
        <button type="submit" class="btn btn-panasonic px-5 fs-5">Ingresar</button>
      </div>
    </form>
  </main>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
