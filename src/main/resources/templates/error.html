<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Error | Panasonic UN1Carga+</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet" />
  <link th:href="@{/css/styles.css}" href="../static/css/styles.css" rel="stylesheet" />
</head>
<body>
  <div th:replace="~{fragments/navbar :: navbar('')}"></div>
  <main class="container d-flex flex-column justify-content-center align-items-center flex-grow-1 text-center py-5">
    <h1 class="fw-bold mb-3">No se pudo completar la acción</h1>
    <p class="fs-5 mb-4" th:text="${mensaje != null ? mensaje : 'Ocurrió un error inesperado.'}">Mensaje de error</p>
    <a th:href="@{/bienvenida}" class="btn btn-panasonic">Ir al inicio</a>
  </main>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
