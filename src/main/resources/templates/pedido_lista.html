<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Pedidos Pendientes | Panasonic UN1Carga+</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet" />
  <link th:href="@{/css/styles.css}" href="../static/css/styles.css" rel="stylesheet" />
</head>
<body>
  <div th:replace="~{fragments/navbar :: navbar('pedido')}"></div>

  <main class="container py-4">
    <div class="row g-4 align-items-stretch">
      <div class="col-lg-5">
        <div class="wire-box h-100">
          <div class="text-center fw-bold fs-5 py-4">Pedidos Pendientes</div>
          <a th:each="p : ${pedidosPendientes}"
             th:href="@{/pedidos(selectedId=${p.id})}"
             class="wire-list-row text-decoration-none text-dark"
             th:classappend="${pedidoSeleccionado != null and pedidoSeleccionado.id == p.id} ? ' bg-light fw-bold' : ''">
            <span th:text="'ID: ' + ${p.id}">ID: 1</span>
            <span th:text="${#temporals.format(p.fecha, 'dd/MM/yyyy')}">dd/mm/aaaa</span>
          </a>
          <div th:if="${#lists.isEmpty(pedidosPendientes)}" class="p-4 text-center text-muted">
            No hay pedidos pendientes.
          </div>
        </div>
      </div>

      <div class="col-lg-7 d-flex flex-column">
        <div class="wire-box text-center fw-bold fs-5 py-3 mb-3"
             th:text="${pedidoSeleccionado != null} ? 'Pedido ID: ' + ${pedidoSeleccionado.id} : 'Pedido ID: —'">
          Pedido ID: 1
        </div>
        <div class="wire-box flex-grow-1 d-flex flex-column justify-content-center align-items-center p-4 mb-4" style="min-height: 280px;">
          <p th:if="${pedidoSeleccionado == null}" class="mb-0 fs-5 text-muted">Información general del pedido</p>
          <div th:if="${pedidoSeleccionado != null}" class="w-100">
            <p class="mb-2"><strong>Fecha:</strong> <span th:text="${#temporals.format(pedidoSeleccionado.fecha, 'dd/MM/yyyy')}"></span></p>
            <p class="mb-2"><strong>Cliente:</strong> <span th:text="${pedidoSeleccionado.cliente != null ? pedidoSeleccionado.cliente.empresa : 'Sin asignar'}"></span></p>
            <p class="mb-0"><strong>Productos registrados:</strong> <span th:text="${#lists.size(pedidoSeleccionado.detalles)}">0</span></p>
          </div>
        </div>
        <div class="d-flex justify-content-center gap-4 flex-wrap">
          <a th:if="${pedidoSeleccionado != null}" th:href="@{/pedidos/editar/{id}(id=${pedidoSeleccionado.id})}" class="btn btn-panasonic">Editar</a>
          <button th:if="${pedidoSeleccionado == null}" type="button" class="btn btn-panasonic-grey" disabled>Editar</button>
          <a th:href="@{/pedidos/nuevo}" class="btn btn-panasonic">Nuevo pedido</a>
        </div>
      </div>
    </div>
  </main>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
