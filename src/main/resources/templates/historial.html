<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Historial | Panasonic UN1Carga+</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet" />
  <link th:href="@{/css/styles.css}" href="../static/css/styles.css" rel="stylesheet" />
</head>
<body>
  <div th:replace="~{fragments/navbar :: navbar('historial')}"></div>

  <main class="container py-4">
    <h1 class="fw-bold text-center mb-3">Buscar por ID:</h1>
    <form class="mb-4" th:action="@{/historial}" method="get">
      <div class="search-slate-wrap">
        <input type="text" name="idPedido" th:value="${idPedido}" placeholder="ID Pedido..." />
      </div>
    </form>

    <div class="table-responsive">
      <table class="table table-panasonic">
        <thead>
          <tr><th>ID Pedido</th><th>Productos Totales</th><th>Fecha</th><th>Espacio Usado</th><th>Espacio Libre</th><th>Acciones</th></tr>
        </thead>
        <tbody>
          <tr th:each="h : ${historialPedidos}">
            <td><a th:href="@{/historial/{id}(id=${h.id})}" class="fw-bold text-decoration-none" style="color: var(--panasonic-blue);" th:text="${h.id}">####</a></td>
            <td th:text="${h.productosTotales}">23</td>
            <td th:text="${#temporals.format(h.fecha, 'dd-MM-yyyy')}">23-01-2027</td>
            <td th:text="${h.espacioUsado} + ' m³'">15 m³</td>
            <td th:text="${h.espacioLibre} + ' m³'">2 m³</td>
            <td>
              <a th:href="@{/pedidos/editar/{id}(id=${h.id})}" class="btn btn-sm btn-outline-primary">Actualizar</a>
              <form th:action="@{/historial/eliminar/{id}(id=${h.id})}" method="post" class="d-inline">
                <button type="submit" class="btn btn-sm btn-outline-danger">Borrar</button>
              </form>
            </td>
          </tr>
        </tbody>
      </table>
    </div>
  </main>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
