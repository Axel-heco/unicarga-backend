<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Bienvenida | Panasonic UN1Carga+</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet" />
  <link th:href="@{/css/styles.css}" href="../static/css/styles.css" rel="stylesheet" />
</head>
<body>
  <div th:replace="~{fragments/navbar :: navbar('home')}"></div>

  <main class="container d-flex flex-column justify-content-center align-items-center flex-grow-1 text-center py-5">
    <h1 class="fw-bold display-6 mb-4" style="max-width: 720px;">
      ¡Bienvenido <span th:text="${nombreUsuario != null ? nombreUsuario : '[Nombre]'}">[Nombre]</span> al sistema de cubicaje UN1CARGA+!
    </h1>
    <h2 class="fw-bold h3">Selecciona una opción:</h2>
  </main>
  <footer class="welcome-bottom-line"></footer>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
