<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<body>
  <div th:fragment="alertas">
    <div th:if="${mensaje}" class="alert alert-success text-center" role="alert" th:text="${mensaje}">Operación exitosa</div>
    <div th:if="${error}" class="alert alert-danger text-center" role="alert" th:text="${error}">Ocurrió un error</div>
  </div>
</body>
</html>
