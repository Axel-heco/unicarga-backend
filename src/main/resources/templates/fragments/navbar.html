<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<body>
  <nav th:fragment="navbar(activeTab)" class="app-navbar d-flex align-items-center justify-content-between flex-wrap gap-2">
    <a th:href="@{/bienvenida}" class="panasonic-wordmark" th:classappend="${activeTab == 'home'} ? ' active-home' : ''">Panasonic</a>
    <div class="d-flex align-items-center gap-3 gap-md-5 mx-auto">
      <a th:href="@{/pedidos}" class="nav-tab-link" th:classappend="${activeTab == 'pedido'} ? ' active' : ''">Pedido</a>
      <a th:href="@{/catalogo}" class="nav-tab-link" th:classappend="${activeTab == 'catalogo'} ? ' active' : ''">Catálogo</a>
      <a th:href="@{/historial}" class="nav-tab-link" th:classappend="${activeTab == 'historial'} ? ' active' : ''">Historial</a>
    </div>
    <div class="dropdown">
      <button class="btn btn-link text-decoration-none p-1" type="button" data-bs-toggle="dropdown" aria-expanded="false">
        <i class="bi bi-three-dots-vertical fs-4" style="color: var(--panasonic-blue);"></i>
      </button>
      <ul class="dropdown-menu dropdown-menu-end">
        <li><span class="dropdown-item-text small text-muted fw-semibold" th:text="${session.usuario != null ? session.usuario.nombre : 'Operador'}">Operador</span></li>
        <li><hr class="dropdown-divider" /></li>
        <li><a class="dropdown-item text-danger fw-semibold" th:href="@{/logout}"><i class="bi bi-box-arrow-right me-2"></i>Cerrar Sesión</a></li>
      </ul>
    </div>
  </nav>
</body>
</html>
