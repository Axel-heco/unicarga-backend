<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Armar Pedido | Panasonic UN1Carga+</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet" />
  <link th:href="@{/css/styles.css}" href="../static/css/styles.css" rel="stylesheet" />
</head>
<body>
  <div th:replace="~{fragments/navbar :: navbar('pedido')}"></div>

  <main class="container-fluid px-4 py-4">
    <div class="row g-4">
      <div class="col-lg-4">
        <div class="product-selector-card">
          <div class="product-selector-header" data-bs-toggle="collapse" data-bs-target="#collapseProductos" role="button">
            <span class="fs-5">Productos</span>
            <i class="bi bi-caret-down-fill position-absolute end-0 me-3"></i>
          </div>
          <div class="collapse show p-3" id="collapseProductos">
            <a th:each="prod : ${productos}"
               th:href="@{/pedidos/editar/{id}(id=${pedido.id}, prodId=${prod.id})}"
               class="product-pill-item text-decoration-none text-dark"
               th:classappend="${productoActivo != null and productoActivo.id == prod.id} ? ' active' : ''">
              <span th:text="'ID.' + ${prod.id}">ID.#</span>
              <span th:text="${prod.nombre}">Producto</span>
            </a>
          </div>
        </div>
      </div>

      <div class="col-lg-4 d-flex flex-column align-items-center pt-2">
        <h3 class="fw-bold mb-3" th:text="${productoActivo != null ? productoActivo.nombre : 'Selecciona un producto'}">Microondas</h3>
        <div class="mb-3" style="height: 95px;">
          <img th:if="${productoActivo != null and productoActivo.imagenUrl != null}" th:src="@{${productoActivo.imagenUrl}}" alt="Producto" style="max-height: 90px;" />
          <i th:if="${productoActivo == null or productoActivo.imagenUrl == null}" class="bi bi-box-seam display-3 text-secondary"></i>
        </div>

        <div class="d-flex align-items-center gap-4 mb-3" th:if="${productoActivo != null}">
          <form th:action="@{/pedidos/{id}/restar/{prodId}(id=${pedido.id}, prodId=${productoActivo.id})}" method="post">
            <button type="submit" class="btn-circle-qty">−</button>
          </form>
          <form th:action="@{/pedidos/{id}/sumar/{prodId}(id=${pedido.id}, prodId=${productoActivo.id})}" method="post">
            <button type="submit" class="btn-circle-qty">+</button>
          </form>
        </div>

        <div class="rounded-pill px-4 py-2 fw-bold mb-4" style="background-color: #dee4eb; min-width: 130px; text-align: center;">
          Total: <span th:text="${cantidadActual != null ? cantidadActual : 0}">0</span>
        </div>

        <div class="w-100 text-center" style="max-width: 240px;">
          <label for="idPedidoBox" class="fw-bold mb-1 d-block">ID.Pedido</label>
          <input type="text" id="idPedidoBox" class="form-control input-slate text-center py-1" th:value="${pedido.id}" readonly />
        </div>
      </div>

      <div class="col-lg-4">
        <h3 class="fw-bold text-center mb-2">Este Pedido:</h3>
        <div class="wire-box" style="min-height: 340px;">
          <table class="table table-bordered mb-0 text-center align-middle" style="border-color: #222;">
            <thead>
              <tr><th>ID</th><th>Nombre</th><th>Cantidad</th><th>Categoría</th></tr>
            </thead>
            <tbody>
              <tr th:each="det : ${pedido.detalles}">
                <td th:text="${det.producto.id}">1</td>
                <td th:text="${det.producto.nombre}">Microondas</td>
                <td th:text="${det.cantidad}">7</td>
                <td th:text="${det.producto.categoria}">Electrodoméstico</td>
              </tr>
              <tr th:if="${#lists.isEmpty(pedido.detalles)}">
                <td colspan="4" class="text-muted py-4">Sin productos aún</td>
              </tr>
            </tbody>
          </table>
        </div>
      </div>
    </div>

    <div class="d-flex justify-content-between pt-4 mt-2 flex-wrap gap-3">
      <button type="button" class="btn btn-panasonic" data-bs-toggle="modal" data-bs-target="#modalAvisoSalida">Guardar y Salir</button>
      <a th:href="@{/pedidos/{id}/calcular(id=${pedido.id})}" class="btn btn-panasonic">Calcular</a>
    </div>
  </main>

  <div class="modal fade" id="modalAvisoSalida" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
      <div class="modal-content border-2 rounded-4">
        <div class="modal-header modal-aviso-header py-3">
          <h2 class="modal-title fw-bold mb-0" style="color: var(--alert-red);">¡¡¡AVISO!!!</h2>
        </div>
        <div class="modal-body text-center py-4">
          <p class="fw-bold fs-4 mb-4">Estas saliendo del Módulo “Pedido”</p>
          <div class="d-grid gap-3 mx-auto" style="max-width: 260px;">
            <form th:action="@{/pedidos/{id}/eliminar(id=${pedido.id})}" method="post">
              <button type="submit" class="btn btn-panasonic-black w-100">Eliminar Pedido</button>
            </form>
            <a th:href="@{/pedidos}" class="btn btn-panasonic-red text-decoration-none">Guardar y Salir</a>
            <button type="button" class="btn btn-panasonic-black" data-bs-dismiss="modal">Volver a Editar</button>
          </div>
        </div>
      </div>
    </div>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
