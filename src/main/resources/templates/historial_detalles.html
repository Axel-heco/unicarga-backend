<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Detalles Historial | Panasonic UN1Carga+</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet" />
  <link th:href="@{/css/styles.css}" href="../static/css/styles.css" rel="stylesheet" />
</head>
<body>
  <header class="app-navbar d-flex justify-content-between align-items-center flex-wrap gap-2">
    <a th:href="@{/bienvenida}" class="panasonic-wordmark">Panasonic</a>
    <h2 class="fw-bold mb-0">Detalles Pedido</h2>
    <div><span class="fw-bold" style="color: var(--panasonic-blue);">Fecha:</span> <strong class="ms-1" th:text="${#temporals.format(pedido.fechaPedido, 'dd-MM-yyyy')}">23-01-2027</strong></div>
  </header>

  <main class="container py-4">
    <div class="row g-4 align-items-start">
      <div class="col-lg-8">
        <div class="table-responsive">
          <table class="table table-panasonic">
            <thead>
              <tr><th>ID</th><th>Nombre</th><th>Cantidad</th><th>Categoría</th></tr>
            </thead>
            <tbody>
              <tr th:each="det : ${detalles}">
                <td th:text="${det.producto.idProducto}">1</td>
                <td th:text="${det.producto.nombreProducto}">Nombre</td>
                <td th:text="${det.totalProducto}">0</td>
                <td th:text="${det.producto.categoria}">Categoría</td>
              </tr>
            </tbody>
          </table>
        </div>
        <div class="mt-4">
          <p class="mb-2 fs-5"><span class="fw-bold" style="color: var(--panasonic-blue);">Productos Totales:</span> <strong class="ms-2" th:text="${pedido.total}">23</strong></p>
          <p class="mb-0 fs-5"><span class="fw-bold" style="color: var(--panasonic-blue);">ID Pedido:</span> <strong class="ms-2" th:text="${pedido.idPedido}">1</strong></p>
        </div>
      </div>

      <div class="col-lg-4 text-center">
        <div class="mb-4"><div class="metric-label">Unidad recomendada:</div><div class="metric-value" th:text="'“' + ${pedido.unidadTransporte.tipoTransporte} + '”'">“Camión”</div></div>
        <div class="mb-4"><div class="metric-label">Espacio Usado:</div><div class="metric-value" th:text="${pedido.espacioUsado} + ' m³'">15 m³</div></div>
        <div class="mb-4"><div class="metric-label">Espacio Libre:</div><div class="metric-value" th:text="${pedido.espacioLibre} + ' m³'">2 m³</div></div>
        <div class="mb-4"><div class="metric-label">%Espacio Usado:</div><div class="metric-value" th:text="${porcentajeUsado} + '%'">75%</div></div>
      </div>
    </div>

    <div class="text-center pt-4">
      <a th:href="@{/historial}" class="btn btn-panasonic">Regresar al Historial</a>
    </div>
  </main>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
