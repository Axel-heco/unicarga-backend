<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Detalles Pedido | Panasonic UN1Carga+</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet" />
  <link th:href="@{/css/styles.css}" href="../static/css/styles.css" rel="stylesheet" />
</head>
<body>
  <header class="app-navbar d-flex justify-content-between align-items-center">
    <a th:href="@{/bienvenida}" class="panasonic-wordmark">Panasonic</a>
    <h2 class="fw-bold mb-0 mx-auto">Detalles Pedido</h2>
    <span style="width: 110px;"></span>
  </header>

  <main class="container py-4">
    <div class="row g-4 align-items-start">
      <div class="col-lg-8">
        <div class="table-responsive">
          <table class="table table-panasonic">
            <thead>
              <tr><th>ID</th><th>Nombre</th><th>Cantidad</th><th>Categoría</th></tr>
            </thead>
            <tbody>
              <tr th:each="det : ${pedido.detalles}">
                <td th:text="${det.producto.id}">####</td>
                <td th:text="${det.producto.nombre}">Nombre</td>
                <td th:text="${det.cantidad}">0</td>
                <td th:text="${det.producto.categoria}">Categoría</td>
              </tr>
            </tbody>
          </table>
        </div>
      </div>

      <div class="col-lg-4 text-center">
        <div class="mb-4"><div class="metric-label">Unidad recomendada:</div><div class="metric-value" th:text="'“' + ${unidadRecomendada} + '”'">“Camión”</div></div>
        <div class="mb-4"><div class="metric-label">Espacio Usado:</div><div class="metric-value" th:text="${espacioUsado} + ' m³'">10 m³</div></div>
        <div class="mb-4"><div class="metric-label">Espacio Libre:</div><div class="metric-value" th:text="${espacioLibre} + ' m³'">0.5 m³</div></div>
        <div class="mb-4"><div class="metric-label">%Espacio Usado:</div><div class="metric-value" th:text="${porcentajeUsado} + '%'">85%</div></div>
      </div>
    </div>

    <div class="d-flex justify-content-between pt-4 flex-wrap gap-3">
      <form th:action="@{/pedidos/{id}/finalizar(id=${pedido.id})}" method="post">
        <button type="submit" class="btn btn-panasonic">Finalizar Pedido</button>
      </form>
      <a th:href="@{/pedidos/editar/{id}(id=${pedido.id})}" class="btn btn-panasonic">Seguir Editando</a>
    </div>
  </main>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
